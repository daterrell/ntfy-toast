name: Rust

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]
  # Creating a release on Forgejo's website also builds the exe and publishes it to GitHub.
  release:
    types: [published]
  workflow_dispatch:

# A release made on the website can also fire a tag push; run those one at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-gnu

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  build:
    # Cross-compiles from Linux with mingw: the exe is fully standalone (no MSVC runtime).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Take version from tag
        # The tag is the source of truth for releases: v1.2.3 builds version 1.2.3,
        # whatever Cargo.toml says.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' isn't a version number. Use a tag like v1.2.3."
            exit 1
          fi
          sed -i "0,/^version = \".*\"/s//version = \"$version\"/" Cargo.toml
          sed -i "/^name = \"ntfy-toast\"$/{n;s/^version = \".*\"/version = \"$version\"/}" Cargo.lock
          echo "Building ntfy-toast $version"
      - run: cargo clippy --locked --release --target $TARGET -- -D warnings
      - run: cargo build --locked --release --target $TARGET
      - name: Collect binary
        run: |
          mkdir dist
          cp target/$TARGET/release/ntfy-toast.exe dist/
          cd dist && sha256sum ntfy-toast.exe > ntfy-toast.exe.sha256
      # Forgejo's fork: GitHub's upload/download-artifact v4+ don't work against Forgejo.
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: ntfy-toast-windows-x64
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Releases are published on GitHub. Forgejo push-mirrors the repo there, tags included.
      GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      GH_REPO: daterrell/ntfy-toast
    steps:
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: ntfy-toast-windows-x64
          path: dist
      - name: Install gh
        run: |
          curl -fsSL https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz | tar xz -C /tmp
          sudo install /tmp/gh_2.102.0_linux_amd64/bin/gh /usr/local/bin/gh
      - name: Wait for the push mirror to bring the tag to GitHub
        run: |
          for _ in $(seq 60); do
            gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" --silent 2>/dev/null && exit 0
            sleep 5
          done
          echo "::error::$GITHUB_REF_NAME didn't reach github.com/$GH_REPO; check the repo's push mirror."
          exit 1
      - name: Publish release
        run: |
          files=(dist/ntfy-toast.exe dist/ntfy-toast.exe.sha256)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Made on the website (or re-run): keep its title and notes, attach the exe.
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag \
              --title "ntfy-toast $GITHUB_REF_NAME" \
              --generate-notes \
              --notes "$(cat <<'EOF'
          ## Install

          1. Download `ntfy-toast.exe` below and move it somewhere permanent, e.g. `%LOCALAPPDATA%\Programs\ntfy-toast\`.
          2. Run `ntfy-toast.exe init`, then edit `%APPDATA%\ntfy-toast\config.toml` to set your topics.
          3. Run `ntfy-toast.exe install` to start it now and at every login.

          The exe isn't code-signed, so Windows SmartScreen may warn on first run: choose **More info → Run anyway**.
          Verify the download with `ntfy-toast.exe.sha256` (`Get-FileHash ntfy-toast.exe`).
          EOF
          )"
          fi
